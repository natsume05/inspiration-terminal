name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job runs the same four gates a developer is expected to run locally,
# so a passing local run predicts a passing build.
jobs:
  test:
    name: Tests, lint and syntax
    runs-on: ubuntu-latest

    strategy:
      # Report every failing PHP version rather than stopping at the first.
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, mbstring, openssl
          coverage: none

      - name: Verify every file parses
        run: |
          find src routes templates bin tools tests public -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Static analysis
        run: php tools/lint.php

      - name: Documentation links and encoding
        run: php tools/check-docs.php

      - name: Run the test suite
        run: php tests/run.php
