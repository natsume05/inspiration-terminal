<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="封面：一颗行星及其星环">
    <!--
        Cover artwork for the demo blog entries, drawn here rather than taken from
        somewhere: the repository ships no third-party imagery, and an entry with
        no cover leaves the index looking like it failed to load one.

        Flat shapes and gradients only, so the file stays small and renders the
        same in every browser.
    -->
    <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#101827"/>
            <stop offset="100%" stop-color="#0b0c10"/>
        </linearGradient>
        <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#45a29e"/>
            <stop offset="100%" stop-color="#1d3b47"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#66fcf1" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#66fcf1" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <rect width="1200" height="480" fill="url(#sky)"/>

    <g fill="#c5c6c7" opacity="0.55">
        <circle cx="120" cy="90" r="2"/>
        <circle cx="260" cy="200" r="1.5"/>
        <circle cx="180" cy="380" r="2"/>
        <circle cx="420" cy="70" r="1.5"/>
        <circle cx="980" cy="120" r="2"/>
        <circle cx="1090" cy="330" r="1.5"/>
        <circle cx="880" cy="400" r="2"/>
        <circle cx="700" cy="60" r="1.5"/>
        <circle cx="60" cy="260" r="1.5"/>
        <circle cx="1140" cy="60" r="1.5"/>
    </g>

    <circle cx="640" cy="240" r="230" fill="url(#glow)"/>
    <circle cx="640" cy="240" r="120" fill="url(#planet)"/>
    <ellipse cx="640" cy="240" rx="235" ry="62" fill="none" stroke="#66fcf1" stroke-width="4" opacity="0.65"/>
    <ellipse cx="640" cy="240" rx="285" ry="80" fill="none" stroke="#45a29e" stroke-width="2" opacity="0.35"/>
</svg>
