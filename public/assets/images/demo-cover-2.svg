        <rect x="204" y="312" width="72" height="8" rx="4"/>
        <rect x="504" y="132" width="72" height="8" rx="4"/>
        <rect x="504" y="152" width="52" height="8" rx="4"/>
        <rect x="504" y="312" width="72" height="8" rx="4"/>
        <rect x="804" y="132" width="72" height="8" rx="4"/>
        <rect x="804" y="312" width="72" height="8" rx="4"/>
        <rect x="804" y="332" width="52" height="8" rx="4"/>
